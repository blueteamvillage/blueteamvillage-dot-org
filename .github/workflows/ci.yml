name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the tree. Without this block the job inherits the repository
# default, which on many orgs is read/write on every scope — a compromised
# dependency running in `npm ci` would inherit that token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # No Contentful/Upstash secrets in CI: the app builds against the
      # bundled fallback content when CONTENTFUL_SPACE_ID is unset.
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-only-secret
