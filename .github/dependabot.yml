# Version updates only. Dependabot *security* updates are a repository
# setting, not part of this file — that toggle ("Automated security fixes")
# was off and has been enabled separately; the groups below deliberately carry
# no `applies-to: security-updates`, so advisory-driven PRs stay ungrouped and
# arrive on their own rather than waiting for the weekly batch.
#
# What this file fixes is the other half: nothing was moving dependencies
# between advisories, so a patch only landed if someone happened to notice.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem cluster rather than per package — a volunteer
      # project can review three PRs a week, not thirty.
      #
      # `next` and `react` deliberately carry NO update-types restriction, so
      # majors stay grouped there. These packages must move in lockstep: a
      # next major with eslint-config-next left behind is the exact version
      # skew that produced a lint toolchain mismatch before, and react without
      # react-dom does not run. Splitting them would be the bug, not the fix.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Minor and patch only. Without this restriction the group swept
      # TypeScript 5 -> 7 and ESLint 9 -> 10 into a single PR (#16), which
      # failed CI outright: typescript-eslint does not support TS 7 yet, so
      # one unready major took the whole batch down with it and nothing else
      # in the group could land. Majors now arrive as individual PRs, each
      # with its own blast radius and its own CI signal.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
